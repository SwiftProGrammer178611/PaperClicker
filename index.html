<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>PaperClipper Game</title>
</head>
<body>
    <section>
        <div class="main">
            <div class="left">
                <h3 class="text-highlight">Gem: <span class = "gem-cost">0</span></h3>
                <div class="paperClipDocumentContainer">
                    <img src="./assets/paperClip.png" alt="" srcset="" class="gem-image" onclick ="incrementGem(event)" draggable="false">
                </div>
                
            </div>
            <script id="upgrade-template" type = "text/template">
                <div class="upgrade" onclick = "buyUpgrade('{{name}}')" id = "{{name}}-upgrade">
                    <div class="left-section">
                        <img src="{{image}}" alt="" class="upgrade-img">
                    </div>
                     <div class="mid-section">
                        <h4 class="text-highlight">{{title}}</h4>
                        <h6 class="text-highlight">{{description}} 🚀</h6>
                        <div class="cost-info">
                            <p>Cost:<span class="{{name}}-cost">{{cost}}</span></p>
                            <img src="./assets/paperClip.png" alt="" srcset="" class="gem-img">
                        </div>
                    </div>
                    <div class="right-section text-highlight">
                        Level<span class="{{name}}-level">0</span>
                    </div>
                    <div class="next-level-info" id="{{name}}-next-level">
                        <p id="{{name}}-next-p">
                            +<span class="{{name}}-increase">{{increase}}</span> gems<br/> per second
                        </p>
                    </div>
                </div>
            </script>

            <div class="right text-highlight" id="upgrades-container">
                </div>

            
        </div>

        <div class="util-buttons">
            <button class="utilButton" onClick = "save()">
                Save
            </button>
            <button class="utilButton" onClick = "load()">
                Load
            </button>
        </div>

    </section>

    <div class="statistics">
        <div class = "texts">
            <p>GPC: <span id = "gpc-text">0</span></p>
            <p>GPS: <span id = "gps-text">1</span></p>

        </div>
    </div>
    <script type = "module" src="script.js"></script>
</body>
</html>
